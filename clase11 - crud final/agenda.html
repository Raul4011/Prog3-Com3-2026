<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="./agenda.css">
    <script src="https://cdn.jsdelivr.net/npm/axios@1.16.1/dist/axios.min.js"></script>
    <script src="./agenda.js" defer></script>
    <title>Agenda 2026 📖</title>
</head>
<body>
    <header class="header">
        <br>
        <h1>Agenda 2026 UTN FRT</h1>
        <br>
    </header>
    <main class="main">
        <br>
        <h2>agenda 2026</h2>
        <br>
        <form action="" class="form" id="formulario">
            <div class="form-group">
                <label for="" class="form-label">nombre</label>
                <input type="text" id="nombre" class="form-control">
            </div>
            <div class="form-group">
                <label for="" class="form-label">apellido</label>
                <input type="text" id="apellido" class="form-control">
            </div>
            <div class="form-group">
                <label for="" class="form-label">email</label>
                <input type="text" id="email" class="form-control">
            </div>
            <div class="form-group">
                <label for="" class="form-label">dni</label>
                <input type="text" id="dni" class="form-control">
            </div>
            <div class="form-group">
                <label for="" class="form-label">imagen</label>
                <input type="text" id="imagen" class="form-control">
            </div>
         

            <button class="btn btn-success" id="btn-agregar">agregar</button>
            <button class="btn btn-warning" id="btn-update">actualizar</button>
        </form>


        <br>
        <table class="table  table-striped table-dark table-bordered" id="tabla">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Nombre y Apellido</th>
                    <th scope="col">Email</th>
                    <th scope="col">Dni</th>
                    <th scope="col">Imagen</th>
                    <th scope="col">Acciones</th>

                </tr>
            </thead>
            <tbody id="tbody">

            </tbody>
        </table id="tabla">
        <br>

    </main>

    <footer class="footer">
        <br>
        <h3>UTN FRT 2026</h3>
        <br>
    </footer>
</body>

</html>
